# Paper3 RadarGrid-Lite Direct G7: 7-channel direct input with identical compact downstream backbone and singlehead.
nc: 1
ch: 7

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, SPPF, [512, 5]]

head:
  - [-1, 1, Conv, [128, 1, 1]]
  - [[11], 1, Detect, [nc]]
